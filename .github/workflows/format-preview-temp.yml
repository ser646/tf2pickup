name: format preview (temporary)

on:
  push:
    branches:
      - feature/skill-onboarding-etf2l-verification

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and show patch
        run: |
          pnpm exec prettier --write src/players/views/html/skill-onboarding-dialog.tsx src/queues/auto/views/html/queue-slot.tsx src/queues/auto/views/html/single-class-queue-slot.tsx
          git diff -- src/players/views/html/skill-onboarding-dialog.tsx src/queues/auto/views/html/queue-slot.tsx src/queues/auto/views/html/single-class-queue-slot.tsx
