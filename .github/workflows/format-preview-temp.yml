name: temporary formatting preview

on:
  push:
    branches:
      - feature/skill-onboarding-etf2l-verification

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/players/views/html/skill-onboarding-dialog.tsx tests/00-misc/03-accept-rules.spec.ts
      - run: git diff -- src/players/views/html/skill-onboarding-dialog.tsx tests/00-misc/03-accept-rules.spec.ts
