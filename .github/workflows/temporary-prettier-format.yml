name: temporary-prettier-format
on:
  push:
    branches:
      - feature/multi-class-signup
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install
      - run: pnpm exec prettier --write src/queues/auto/join.test.ts src/queues/auto/join.ts src/websocket/gateway.ts
      - name: Print formatted files
        run: |
          cat src/queues/auto/join.test.ts
          echo '---JOIN_TS---'
          cat src/queues/auto/join.ts
          echo '---GATEWAY_TS---'
          cat src/websocket/gateway.ts
