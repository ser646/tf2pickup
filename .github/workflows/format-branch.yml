name: format branch
on:
  push:
    branches:
      - feature/discord-voice
      - feature/multi-class-signup

permissions:
  contents: write

jobs:
  format:
    if: startsWith(github.event.head_commit.message, '[format]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install
      - run: pnpm exec prettier --write src/discord/game-voice/nicknames.ts src/discord/linking-code.ts src/discord/plugins/game-voice.ts src/discord/views/html/discord-settings-entry.tsx src/queues/auto/join.test.ts src/routes/discord/link/index.tsx
      - name: Commit formatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/discord/game-voice/nicknames.ts src/discord/linking-code.ts src/discord/plugins/game-voice.ts src/discord/views/html/discord-settings-entry.tsx src/queues/auto/join.test.ts src/routes/discord/link/index.tsx
            git commit -m "[format] Apply Prettier to Discord changes"
            git push
          fi

