name: check
on:
  push:
    branches:
      - 'master'
      - 'renovate/**'
    tags:
      - '*.*.*'
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install
      - run: pnpm exec prettier --write src/admin/queues/views/html/queue-settings.page.tsx src/queues/auto/views/html/auto-queue-content.tsx tests/10-queue/16-multiple-class-availability.spec.ts && git diff -- src/admin/queues/views/html/queue-settings.page.tsx src/queues/auto/views/html/auto-queue-content.tsx tests/10-queue/16-multiple-class-availability.spec.ts
      - run: pnpm lint

  xss-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install
      - run: pnpm xss-scan
