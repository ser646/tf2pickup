name: Temporary Prettier format
on:
  push:
    branches:
      - feature/multi-class-signup
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/queues/auto/views/html/queue-slot.tsx
      - run: cat src/queues/auto/views/html/queue-slot.tsx
